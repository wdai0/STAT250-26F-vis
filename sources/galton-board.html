<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Release a ball, start a rain of random paths, and watch a binomial distribution take shape.">
  <title>Galton board · STAT 250</title>
  <style>
    body.galton-page { margin:0; padding:24px; background:#fff; color:#363b39; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body.galton-page.is-embedded { padding:0; }
    .galton-shell { max-width:1120px; margin:0 auto; padding:24px 28px 18px; background:#faf7f1; border:1px solid #e1ddd4; border-radius:2px; }
    .galton-heading { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px 20px; padding-bottom:16px; margin-bottom:6px; border-bottom:1px solid #e1ddd4; }
    .galton-page .galton-heading h1 { margin:0; color:#363b39; font:400 1.6rem/1.2 Georgia,"Times New Roman",serif; letter-spacing:-.025em; }
    .galton-heading p { margin:0; color:#716e64; font-size:.75rem; }
    .galton-stage { position:relative; overflow:hidden; background:#faf7f1; }
    .galton-status { display:flex; align-items:center; justify-content:space-between; gap:12px; position:absolute; z-index:2; top:15px; right:0; left:0; pointer-events:none; color:#716e64; font-size:.72rem; line-height:1.35; }
    .galton-counter { display:flex; align-items:center; gap:7px; }
    .galton-counter strong { color:#363b39; font-weight:500; font-variant-numeric:tabular-nums; }
    .galton-mode { color:#716e64; }
    .galton-canvas { display:block; width:100%; height:442px; cursor:pointer; touch-action:manipulation; outline-offset:-3px; }
    .galton-canvas:focus-visible { outline:2px solid #8f7650; }
    .galton-controls { padding:15px 0 18px; display:grid; grid-template-columns:minmax(270px,1.15fr) minmax(110px,.7fr) minmax(150px,1fr); gap:26px; align-items:center; color:#363b39; }
    .galton-actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
    .galton-page .galton-button { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:39px; border:1px solid #d7d2c7; border-radius:2px; padding:8px 12px; background:#faf7f1; color:#363b39; font:500 .76rem/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; white-space:nowrap; transition:background .15s; }
    .galton-page .galton-button:hover { background:#eeebe3; }
    .galton-page .galton-button-primary { color:#faf7f1; background:#414942; border-color:#414942; min-width:111px; }
    .galton-page .galton-button-primary:hover { background:#525a53; }
    .galton-button svg { width:12px; height:12px; fill:currentColor; flex:none; }
    .galton-button-reset svg { fill:none; stroke:currentColor; stroke-width:1.7; }
    .galton-slider { min-width:0; }
    .galton-slider label { display:flex; align-items:center; justify-content:space-between; gap:8px; color:#716e64; font-size:.72rem; line-height:1.3; }
    .galton-slider output { color:#363b39; font-size:.76rem; font-weight:500; font-variant-numeric:tabular-nums; }
    .galton-page .galton-slider input { display:block; width:100%; height:4px; margin:13px 0 4px; accent-color:#616963; cursor:pointer; }
    .galton-options { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:9px 18px; padding-top:12px; border-top:1px solid #e1ddd4; color:#716e64; font-size:.72rem; }
    .galton-options label, .galton-dot-key { display:flex; align-items:center; gap:7px; }
    .galton-options label { cursor:pointer; }
    .galton-dot-key::before { content:""; width:5px; height:5px; background:#616963; border-radius:50%; }
    .galton-options input { width:14px; height:14px; margin:0; accent-color:#616963; }
    .galton-summary { font-variant-numeric:tabular-nums; }
    .galton-page .attribution { margin-top:17px; padding-top:12px; border-color:#e1ddd4; color:#716e64; }
    @media (max-width:760px) {
      .galton-shell { padding:22px 20px 18px; }
      .galton-controls { grid-template-columns:1fr 1.2fr; gap:19px 24px; padding:15px 0 18px; }
      .galton-actions { grid-column:1/-1; justify-content:center; }
      .galton-canvas { height:418px; }
    }
    @media (max-width:440px) {
      body.galton-page { padding:16px; }
      .galton-shell { padding:18px 15px 15px; }
      .galton-heading { gap:6px; padding-bottom:13px; }
      .galton-page .galton-heading h1 { font-size:1.4rem; }
      .galton-heading p { font-size:.7rem; }
      .galton-canvas { height:402px; }
      .galton-controls { gap:20px; }
      .galton-page .galton-button { padding:9px 10px; font-size:.72rem; }
      .galton-page .galton-button-primary { min-width:105px; }
      .galton-status { font-size:.66rem; }
      .galton-options { font-size:.68rem; }
    }
    @media (pointer:coarse) { .galton-page .galton-button { min-height:44px; } }
  </style>

<body class="galton-page">
  <main class="galton-shell">
    <header class="galton-heading">
      <h1>Galton board</h1>
      <p>Click the board to release a ball.</p>
    </header>
    <section class="galton-stage" aria-label="Interactive Galton board">
      <div class="galton-status" aria-hidden="true">
        <span class="galton-counter"><strong id="landed-count">0</strong> landed<span class="galton-mode" id="flight-count"></span></span>
        <span class="galton-mode" id="motion-label">Ready</span>
      </div>
      <canvas id="board" class="galton-canvas" tabindex="0" role="button" aria-label="Release a ball into the Galton board. Press Enter or Space to release one." aria-describedby="board-summary"></canvas>
      <div class="galton-controls">
        <div class="galton-actions">
          <button class="galton-button" id="release" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.5"/></svg>Release one</button>
          <button class="galton-button galton-button-primary" id="rain" type="button"><svg id="rain-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5 13 8 4 13.5Z"/></svg><span id="rain-label">Start rain</span></button>
          <button class="galton-button galton-button-reset" id="reset" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 4.5a5.2 5.2 0 1 1-.2 6.6M3.2 1.8v3.5h3.5"/></svg>Reset</button>
        </div>
        <div class="galton-slider"><label for="rows">Rows <output id="rows-value" for="rows">12</output></label><input id="rows" type="range" min="8" max="18" value="12" step="2"></div>
        <div class="galton-slider"><label for="bias">Chance of right <output id="bias-value" for="bias">50%</output></label><input id="bias" type="range" min="0" max="100" value="50" step="5"></div>
      </div>
    </section>
    <div class="galton-options">
      <span class="galton-dot-key">One dot = one landing</span>
      <label><input id="expected" type="checkbox" checked>Binomial reference</label>
      <span class="galton-summary" id="board-summary" role="status" aria-live="polite">0 balls landed · 12 rows · 50% chance of right</span>
    </div>
    <!-- AUTHORSHIP -->
  </main>
  <script>
    // Pure sampling and counting. Every rendered ball uses one immutable path.
    const GaltonMath = (() => {
      'use strict';
      function validateSettings(rows, p) {
        if (!Number.isInteger(rows) || rows < 1 || rows > 64) throw new RangeError('Rows must be an integer from 1 to 64.');
        if (!Number.isFinite(p) || p < 0 || p > 1) throw new RangeError('The chance of right must be between 0 and 1.');
      }
      function binomialProbabilities(rows, p) {
        validateSettings(rows, p);
        const probabilities = Array(rows + 1).fill(0);
        if (p === 0 || p === 1) { probabilities[p === 0 ? 0 : rows] = 1; return probabilities; }
        // Start at the mode to avoid unstable division by an underflowed tail.
        const mode = Math.min(rows, Math.floor((rows + 1) * p));
        probabilities[mode] = 1;
        for (let k = mode; k > 0; k -= 1) probabilities[k - 1] = probabilities[k] * k / (rows - k + 1) * (1 - p) / p;
        for (let k = mode; k < rows; k += 1) probabilities[k + 1] = probabilities[k] * (rows - k) / (k + 1) * p / (1 - p);
        const sum = probabilities.reduce((total, value) => total + value, 0);
        return probabilities.map(value => value / sum);
      }
      function samplePath(rows, p, rng = Math.random) {
        validateSettings(rows, p);
        const path = [0];
        for (let row = 0; row < rows; row += 1) {
          const uniform = rng();
          if (!Number.isFinite(uniform) || uniform < 0 || uniform >= 1) throw new RangeError('Random draws must be in [0, 1).');
          path.push(path[row] + (uniform < p ? 1 : 0));
        }
        return Object.freeze(path);
      }
      function createRun(rows, p) {
        validateSettings(rows, p);
        return {rows, p, generation:0, nextId:0, total:0, counts:Array(rows + 1).fill(0), balls:[]};
      }
      function releaseBall(run, rng = Math.random) {
        const path = samplePath(run.rows, run.p, rng);
        const ball = {id:run.nextId++, generation:run.generation, path, bin:path[run.rows], completed:false};
        run.balls.push(ball);
        return ball;
      }
      function completeBall(run, ball) {
        const index = run.balls.indexOf(ball);
        if (ball.generation !== run.generation || ball.completed || index === -1) return false;
        ball.completed = true;
        run.counts[ball.bin] += 1;
        run.total += 1;
        run.balls.splice(index, 1);
        return true;
      }
      function resetRun(run, rows = run.rows, p = run.p) {
        validateSettings(rows, p);
        run.rows = rows;
        run.p = p;
        run.generation += 1;
        run.nextId = 0;
        run.total = 0;
        run.counts = Array(rows + 1).fill(0);
        run.balls.length = 0;
        return run;
      }
      return Object.freeze({validateSettings, binomialProbabilities, samplePath, createRun, releaseBall, completeBall, resetRun});
    })();
  </script>
  <script>
    // Visual geometry only: sampling and exactly-once accounting stay in GaltonMath.
    const GaltonMotion = (() => {
      'use strict';
      const rate = 3.8;
      const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));
      function timing(rows) {
        const entry = .32, fall = .7, landing = 3.9, finish = landing + .28;
        const lastContact = landing - fall;
        return {entry, step:(lastContact - entry) / Math.max(1, rows - 1), lastContact, fall, landing, finish};
      }
      function geometry(width, height, rows) {
        const gap = Math.min(Math.max(1, width - 24), 760) / (rows + 1);
        const top = 66, baseline = height - 38, plotHeight = 112;
        const rowGap = (baseline - plotHeight - 30 - top) / Math.max(1, rows - 1);
        return {width, height, rows, gap, top, rowGap, baseline, plotHeight,
          ballRadius:width < 500 ? 2.8 : 3.5, pegRadius:width < 500 ? 1.5 : 1.8,
          pegX:(row, rights) => width / 2 + (rights - row / 2) * gap,
          binX:k => width / 2 + (k - rows / 2) * gap};
      }
      function stackLayout(counts, total, expected, g) {
        const tallest = Math.max(1, ...counts, total * Math.max(...expected));
        const dotGap = Math.min(6.5, (g.plotHeight - 8) / tallest);
        // No minimum radius or count cap: every landing keeps its own dot.
        return {dotGap, radius:Math.min(2.35, dotGap * .34, g.gap * .2)};
      }
      function landingSlot(run, ball, expected, g) {
        const counts = run.counts.slice();
        let total = run.total;
        // All paths take the same time. Earlier pending balls land first, so this
        // projection is the exact stack when this ball finishes settling.
        for (const pending of run.balls) {
          counts[pending.bin] += 1;
          total += 1;
          if (pending === ball) break;
        }
        const stack = stackLayout(counts, total, expected, g);
        const index = counts[ball.bin] - 1;
        return {x:g.binX(ball.bin), y:g.baseline - stack.radius - index * stack.dotGap,
          radius:stack.radius, index, total};
      }
      function contactRow(age, rows) {
        const time = timing(rows);
        if (age < time.entry) return -1;
        return Math.min(rows - 1, Math.floor((age - time.entry) / time.step + 1e-10));
      }
      function pegOffset(age, direction) {
        const t = clamp(age / .22, 0, 1);
        const shift = 2.7 * Math.sin(Math.PI * t) * (1 - t);
        return {x:direction * shift * .22, y:shift};
      }
      function position(age, path, g, target) {
        const rows = path.length - 1;
        const time = timing(rows);
        const offset = g.ballRadius + g.pegRadius;
        if (age < time.entry) {
          const t = clamp(age / time.entry, 0, 1);
          return {x:g.width / 2, y:32 + (g.top - offset - 32) * t * t, radius:g.ballRadius};
        }
        if (age < time.lastContact && rows > 1) {
          const progress = (age - time.entry) / time.step;
          const row = Math.min(rows - 2, Math.floor(progress));
          const t = progress - row;
          const x0 = g.pegX(row, path[row]), x1 = g.pegX(row + 1, path[row + 1]);
          const kick = Math.min(10, g.rowGap * .55);
          return {x:x0 + (x1 - x0) * t,
            y:g.top + row * g.rowGap - offset + (g.rowGap + kick) * t * t - kick * t,
            radius:g.ballRadius};
        }
        const startX = g.pegX(rows - 1, path[rows - 1]);
        const startY = g.top + (rows - 1) * g.rowGap - offset;
        if (age < time.landing) {
          const t = clamp((age - time.lastContact) / time.fall, 0, 1);
          const blend = t * t * (3 - 2 * t);
          return {x:startX + (target.x - startX) * t,
            y:startY + (target.y - startY + 5) * t * t - 5 * t,
            radius:g.ballRadius + (target.radius - g.ballRadius) * blend};
        }
        const t = clamp((age - time.landing) / (time.finish - time.landing), 0, 1);
        return {x:target.x, y:target.y - 5 * Math.sin(Math.PI * t) * (1 - t), radius:target.radius};
      }
      return Object.freeze({rate, timing, geometry, stackLayout, landingSlot, position, contactRow, pegOffset});
    })();
  </script>
  <script>
    (() => {
      'use strict';
      if (window.parent !== window) document.body.classList.add('is-embedded');
      const $ = selector => document.querySelector(selector);
      const canvas = $('#board');
      const ctx = canvas.getContext('2d');
      // Settled observations are repainted only when counts or geometry change.
      const distribution = document.createElement('canvas');
      const distributionContext = distribution.getContext('2d');
      const rowsInput = $('#rows');
      const biasInput = $('#bias');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const run = GaltonMath.createRun(Number(rowsInput.value), Number(biasInput.value) / 100);
      let expected = GaltonMath.binomialProbabilities(run.rows, run.p);
      let width = 0, height = 0, dpr = 1, geometry = null;
      let playing = !reducedMotion.matches;
      let rain = false;
      let welcomeRemaining = reducedMotion.matches ? 0 : 20;
      let parentVisible = true;
      let lastTime = null, frame = null, emissionClock = 0;
      let distributionDirty = true;
      const impacts = new Map();
      const visible = () => parentVisible && !document.hidden;

      function updateGeometry() { geometry = GaltonMotion.geometry(width, height, run.rows); }
      function resize() {
        const bounds = canvas.getBoundingClientRect();
        if (bounds.width <= 0 || bounds.height <= 0) return;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        if (bounds.width !== width || bounds.height !== height || ratio !== dpr) {
          width = bounds.width; height = bounds.height; dpr = ratio;
          canvas.width = distribution.width = Math.round(width * dpr);
          canvas.height = distribution.height = Math.round(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          distributionContext.setTransform(dpr, 0, 0, dpr, 0, 0);
          updateGeometry();
          distributionDirty = true;
        }
        draw();
      }
      function release() {
        if (run.balls.length >= 260) return;
        const ball = GaltonMath.releaseBall(run);
        ball.age = 0;
        ball.lastPeg = -1;
        if (reducedMotion.matches) {
          GaltonMath.completeBall(run, ball);
          distributionDirty = true;
        }
      }
      function summary() {
        const values = [
          ['#landed-count', run.total.toLocaleString()],
          ['#flight-count', run.balls.length ? ` / ${run.balls.length} in flight` : ''],
          ['#board-summary', `${run.total.toLocaleString()} balls landed · ${run.rows} rows · ${Math.round(run.p * 100)}% chance of right`]
        ];
        for (const [selector, value] of values) {
          const element = $(selector);
          if (element.textContent !== value) element.textContent = value;
        }
      }
      function updateControls() {
        const active = playing && visible();
        const unfinished = run.balls.length || welcomeRemaining || impacts.size;
        $('#motion-label').textContent = active ? 'In motion' : (unfinished ? 'Paused' : 'Ready');
        $('#rain-label').textContent = active ? 'Pause' : (unfinished ? 'Resume' : 'Start rain');
        $('#rain-icon').innerHTML = active ? '<path d="M3 2h3.5v12H3zm6.5 0H13v12H9.5z"/>' : '<path d="M4 2.5 13 8 4 13.5Z"/>';
        $('#rain').setAttribute('aria-label', active ? 'Pause all motion' : (unfinished ? 'Resume motion' : 'Start rain of balls'));
        if (reducedMotion.matches) {
          $('#motion-label').textContent = 'Reduced motion';
          $('#rain-label').textContent = 'Release 100';
          $('#rain').setAttribute('aria-label', 'Release 100 balls without animation');
        }
      }
      function requestFrame() {
        if (frame === null && playing && visible() && !reducedMotion.matches) frame = requestAnimationFrame(tick);
      }
      function cancelFrame() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null; lastTime = null;
      }
      function step(dt) {
        // Each impact belongs to the actual struck peg, with no decorative rings.
        for (const [key, impact] of impacts) {
          impact.age += dt;
          if (impact.age >= .22) impacts.delete(key);
        }
        if (rain || welcomeRemaining > 0) {
          emissionClock += dt;
          while (emissionClock >= 1 / GaltonMotion.rate) {
            emissionClock -= 1 / GaltonMotion.rate;
            release();
            if (welcomeRemaining > 0) welcomeRemaining -= 1;
            if (!rain && welcomeRemaining === 0) { emissionClock = 0; break; }
          }
        }
        const finish = GaltonMotion.timing(run.rows).finish;
        for (const ball of [...run.balls]) {
          ball.age += dt;
          const peg = GaltonMotion.contactRow(ball.age, run.rows);
          for (let row = ball.lastPeg + 1; row <= peg; row += 1) {
            const rights = ball.path[row];
            impacts.set(`${row}:${rights}`, {age:0, direction:2 * (ball.path[row + 1] - rights) - 1});
          }
          ball.lastPeg = Math.max(ball.lastPeg, peg);
          // Contact is followed by one short settling bounce before the count.
          if (ball.age >= finish && GaltonMath.completeBall(run, ball)) distributionDirty = true;
        }
        summary();
        if (!rain && !welcomeRemaining && !run.balls.length && !impacts.size) {
          playing = false; lastTime = null; updateControls();
        }
      }
      function tick(timestamp) {
        frame = null;
        if (!playing || !visible() || reducedMotion.matches) { lastTime = null; return; }
        // Pausing or hiding the frame suspends time; resuming never catches up.
        const dt = lastTime === null ? 0 : Math.min((timestamp - lastTime) / 1000, .05);
        lastTime = timestamp;
        if (geometry) { step(dt); draw(); }
        requestFrame();
      }
      function dot(context, x, y, radius, color) {
        context.beginPath(); context.arc(x, y, radius, 0, Math.PI * 2);
        context.fillStyle = color; context.fill();
      }
      function cacheDistribution() {
        const g = geometry, c = distributionContext;
        c.clearRect(0, 0, width, height);
        const stack = GaltonMotion.stackLayout(run.counts, run.total, expected, g);
        c.fillStyle = '#616963';
        // A separate filled circle for every counted ball, including long runs.
        for (let k = 0; k <= run.rows; k += 1) {
          c.beginPath();
          for (let i = 0; i < run.counts[k]; i += 1) {
            const x = g.binX(k), y = g.baseline - stack.radius - i * stack.dotGap;
            c.moveTo(x + stack.radius, y); c.arc(x, y, stack.radius, 0, Math.PI * 2);
          }
          c.fill();
        }
        if ($('#expected').checked && run.total > 0) {
          c.beginPath();
          expected.forEach((p, k) => {
            const x = g.binX(k), y = g.baseline - run.total * p * stack.dotGap;
            if (k === 0) c.moveTo(x, y); else c.lineTo(x, y);
          });
          c.strokeStyle = '#b1a28c'; c.lineWidth = 1; c.stroke();
        }
        c.beginPath(); c.moveTo(0, g.baseline + 1); c.lineTo(width, g.baseline + 1);
        c.strokeStyle = '#e1ddd4'; c.lineWidth = 1; c.stroke();
        c.fillStyle = '#716e64'; c.font = '11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif'; c.textAlign = 'center';
        const labelStep = width < 420 && run.rows > 12 ? 2 : 1;
        for (let k = 0; k <= run.rows; k += labelStep) c.fillText(String(k), g.binX(k), g.baseline + 17);
        c.fillText('Right turns', width / 2, height - 4);
        distributionDirty = false;
      }
      function draw() {
        if (!geometry || !width) return;
        const g = geometry;
        ctx.clearRect(0, 0, width, height);
        if (distributionDirty) cacheDistribution();
        ctx.drawImage(distribution, 0, 0, width, height);
        for (let row = 0; row < run.rows; row += 1) {
          for (let k = 0; k <= row; k += 1) {
            const impact = impacts.get(`${row}:${k}`);
            const shift = impact ? GaltonMotion.pegOffset(impact.age, impact.direction) : {x:0, y:0};
            dot(ctx, g.pegX(row, k) + shift.x, g.top + row * g.rowGap + shift.y, g.pegRadius, '#c9c5b9');
          }
        }
        for (const ball of run.balls) {
          const target = GaltonMotion.landingSlot(run, ball, expected, g);
          const point = GaltonMotion.position(ball.age, ball.path, g, target);
          dot(ctx, point.x, point.y, point.radius, '#8f7650');
        }
      }
      function updateWithoutMotion() { summary(); updateControls(); draw(); }
      function releaseOne() {
        if (!playing) rain = false;
        release(); welcomeRemaining = 0;
        if (reducedMotion.matches) { updateWithoutMotion(); return; }
        playing = true; lastTime = null;
        summary(); updateControls(); requestFrame();
      }
      function reset(rows = run.rows, p = run.p) {
        cancelFrame();
        GaltonMath.resetRun(run, rows, p);
        expected = GaltonMath.binomialProbabilities(rows, p);
        impacts.clear(); distributionDirty = true;
        rain = false; welcomeRemaining = 0; emissionClock = 0; playing = false;
        updateGeometry(); updateWithoutMotion();
      }
      $('#release').addEventListener('click', releaseOne);
      canvas.addEventListener('click', releaseOne);
      canvas.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); releaseOne(); }
      });
      $('#rain').addEventListener('click', () => {
        if (reducedMotion.matches) {
          for (let i = 0; i < 100; i += 1) release();
          updateWithoutMotion(); return;
        }
        if (playing) { playing = false; cancelFrame(); }
        else {
          playing = true;
          if (!run.balls.length && !welcomeRemaining && !impacts.size) rain = true;
          requestFrame();
        }
        updateControls(); summary();
      });
      $('#reset').addEventListener('click', () => reset());
      function settingsChanged() {
        const rows = Number(rowsInput.value), p = Number(biasInput.value) / 100;
        $('#rows-value').value = rows;
        $('#bias-value').value = `${Math.round(p * 100)}%`;
        reset(rows, p);
      }
      rowsInput.addEventListener('input', settingsChanged);
      biasInput.addEventListener('input', settingsChanged);
      $('#expected').addEventListener('change', () => { distributionDirty = true; draw(); });
      function visibilityChanged() {
        cancelFrame(); updateControls();
        if (visible()) { resize(); requestFrame(); }
      }
      document.addEventListener('visibilitychange', visibilityChanged);
      window.addEventListener('message', event => {
        if (event.source !== window.parent || event.origin !== window.location.origin) return;
        if (event.data && event.data.type === 'stat250:visibility' && typeof event.data.visible === 'boolean') {
          parentVisible = event.data.visible; visibilityChanged();
        }
      });
      reducedMotion.addEventListener('change', () => {
        cancelFrame(); playing = false; rain = false; welcomeRemaining = 0;
        for (const ball of [...run.balls]) GaltonMath.completeBall(run, ball);
        impacts.clear(); distributionDirty = true;
        updateWithoutMotion();
      });
      new ResizeObserver(resize).observe(canvas);
      resize(); summary(); updateControls(); requestFrame();
    })();
  </script>
</body>
</html>
