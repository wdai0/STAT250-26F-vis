<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="STAT 250 interactive statistics: play with a Galton board, explore visualizations, and create your own.">
  <meta name="theme-color" content="#ffffff">
  <title>STAT 250 · Introductory Statistics I</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231c3553'/%3E%3Cpath d='M16 45V33m16 12V19m16 26V27' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/catalog.js" defer></script>
  <script src="assets/site.js" defer></script>
</head>
<body class="site-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-wrap">
    <header class="site-header">
      <a class="brand" href="#home" aria-label="STAT 250 home">
        <span><strong data-site-title>STAT 250</strong><span class="brand-subtitle" data-site-subtitle>Introductory Statistics I</span></span>
      </a>
      <div class="header-meta"><span class="term" data-site-term>Fall 2026</span><a class="source-link" href="https://github.com/wdai0/STAT250-26F-vis" target="_blank" rel="noopener">View source <span aria-hidden="true">↗</span></a></div>
    </header>

    <nav class="navigation" aria-label="Visualization navigation">
      <button id="browse-button" class="button browse-trigger" type="button" aria-haspopup="dialog" aria-controls="browse-dialog" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="12" y="2" width="6" height="6" rx="1"/><rect x="2" y="12" width="6" height="6" rx="1"/><rect x="12" y="12" width="6" height="6" rx="1"/></svg>
        Browse visualizations <span id="browse-count" class="browse-count" aria-hidden="true"></span><span aria-hidden="true">→</span>
      </button>
      <a id="home-link" class="guide-link" href="#home">Home</a>
      <a id="create-link" class="guide-link" href="#create-your-own">Create your own</a>
      <span id="current-view" class="current-view"></span>
      <div id="visualization-actions" class="visualization-actions" hidden>
        <a id="open-visualization" class="button button-secondary" target="_blank" rel="noopener">Open on its own ↗</a>
        <a id="download-visualization" class="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-3-3 3 3 3-3M4 13v3h12v-3"/></svg>Download</a>
      </div>
    </nav>

    <dialog id="browse-dialog" class="browse-dialog" aria-labelledby="browse-heading">
      <div class="browse-header">
        <h2 id="browse-heading">Browse visualizations</h2>
        <button id="browse-close" class="button button-secondary" type="button" aria-label="Close visualization browser">Close</button>
      </div>
      <label for="visualization-search" class="search-label">Search by name or topic</label>
      <div class="search-controls">
        <input id="visualization-search" type="search" placeholder="e.g. bootstrap, NBA, sample size" autocomplete="off" autofocus>
        <button id="clear-search" class="button button-secondary" type="button" hidden>Clear</button>
      </div>
      <p id="search-status" class="search-status" role="status" aria-live="polite"></p>
      <nav id="browse-results" class="browse-results" aria-label="Visualizations by topic"></nav>
    </dialog>

    <main id="main" tabindex="-1">
      <p id="route-message" class="notice" role="status" hidden></p>
      <div id="visualization-panels"></div>
      <section id="home-collection" class="home-collection" aria-labelledby="collection-title" hidden>
        <div class="section-heading">
          <div><h2 id="collection-title">Explore the collection</h2><p id="collection-count" class="muted"></p></div>
          <button id="browse-more" class="button button-secondary" type="button" aria-haspopup="dialog" aria-controls="browse-dialog">Browse all →</button>
        </div>
        <div id="topic-links" class="topic-links"></div>
        <a class="create-callout" href="#create-your-own"><span><strong>Create your own</strong><span>Guidelines and a ready-to-copy prompt.</span></span><span aria-hidden="true">↗</span></a>
      </section>
      <noscript><p class="notice">Enable JavaScript to navigate the collection and use its interactive visualizations.</p></noscript>
    </main>

    <footer class="site-footer">
      <div id="site-authorship" class="site-authorship"></div>
      <a href="https://github.com/wdai0/STAT250-26F-vis/blob/main/LICENSE" target="_blank" rel="noopener">MIT license <span aria-hidden="true">↗</span></a>
    </footer>
  </div>
</body>
</html>
